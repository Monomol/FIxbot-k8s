{{- range $slug, $course := .Values.courses }}
{{- $config := (include "fixbot.courseConfig" (dict "root" $ "slug" $slug "course" $course)) | fromYaml }}
{{- if $config.provisioning.enabled }}
{{- $prefix := include "fixbot.coursePrefix" (dict "Release" $.Release "slug" $slug) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $prefix }}-provision
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "fixbot.labels" $ | nindent 4 }}
    {{- include "fixbot.courseLabels" (dict "slug" $slug) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $prefix }}-provision
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "fixbot.labels" $ | nindent 4 }}
    {{- include "fixbot.courseLabels" (dict "slug" $slug) | nindent 4 }}
rules:
  # The provisioning Job manages the API-key Secret itself (it is NOT a chart
  # resource, so Helm never resets/overwrites it on upgrade).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ $prefix }}-provision"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $prefix }}-provision
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "fixbot.labels" $ | nindent 4 }}
    {{- include "fixbot.courseLabels" (dict "slug" $slug) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $prefix }}-provision
subjects:
  - kind: ServiceAccount
    name: {{ $prefix }}-provision
    namespace: {{ $.Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prefix }}-provision-config
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "fixbot.labels" $ | nindent 4 }}
    {{- include "fixbot.courseLabels" (dict "slug" $slug) | nindent 4 }}
data:
  provision.py: |
{{ $.Files.Get "scripts/provision.py" | indent 4 }}
---
# Re-runs on every helm upgrade (post-install/post-upgrade): bootstraps the
# service-account API key once, then reconciles admins + general settings
# against the live instance, so value.yaml changes reach running instances.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $prefix }}-provision
  namespace: {{ $.Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "fixbot.labels" $ | nindent 4 }}
    {{- include "fixbot.courseLabels" (dict "slug" $slug) | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fixbot
        fixbot.example.com/course: {{ $slug }}
        fixbot.example.com/component: provision
    spec:
      serviceAccountName: {{ $prefix }}-provision
      # PodSecurity "restricted" requirements
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: "{{ $.Values.openWebUI.provisioning.image.repository }}:{{ $.Values.openWebUI.provisioning.image.tag }}"
          imagePullPolicy: {{ $.Values.openWebUI.provisioning.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["python", "/scripts/provision.py"]
          env:
            - name: TARGET_URL
              value: "http://{{ $prefix }}-svc"
            - name: NAMESPACE
              value: {{ $.Values.namespace | quote }}
            - name: PROVISION_SECRET_NAME
              value: "{{ $prefix }}-provision"
            - name: SA_EMAIL
              value: {{ $config.provisioning.serviceAccount.email | quote }}
            - name: ADMIN_EMAILS
              value: {{ $config.admins | toJson | quote }}
            - name: DEFAULT_MODELS
              value: {{ $config.provisioning.settings.defaultModels | quote }}
            - name: DEFAULT_PINNED_MODELS
              value: {{ $config.provisioning.settings.defaultPinnedModels | quote }}
            - name: MODEL_ORDER_LIST
              value: {{ $config.provisioning.settings.modelOrderList | toJson | quote }}
            - name: DEFAULT_MODEL_METADATA
              value: {{ $config.provisioning.settings.defaultModelMetadata | toJson | quote }}
            - name: DEFAULT_MODEL_PARAMS
              value: {{ $config.provisioning.settings.defaultModelParams | toJson | quote }}
            # When true (openWebUI.selfSignup), the Job re-enables signup after
            # its bootstrap signup (OWUI auto-disables signup after the first
            # user, which is this service account). See scripts/provision.py.
            - name: REENABLE_SIGNUP
              value: {{ $config.openWebUI.selfSignup | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml $.Values.openWebUI.provisioning.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ $prefix }}-provision-config
{{- end }}
{{- end }}
