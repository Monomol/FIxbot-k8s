{{- if .Values.monitoring.enabled }}
{{- $m := .Values.monitoring }}
{{- $ns := .Values.namespace }}
{{- $loki := $m.loki }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixbot.fullname" . }}-loki-config
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false
    common:
      path_prefix: /loki
      storage:
        {{- if $loki.interimFilesystem.enabled }}
        # Optional local-filesystem fallback when the object store is
        # unavailable. Logs written here are not retro-shipped to the bucket.
        # Flip monitoring.loki.interimFilesystem.enabled back to false when the
        # object store is healthy.
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
        {{- else }}
        s3:
          endpoint: {{ $loki.endpointURL | replace "https://" "" | replace "http://" "" }}
          region: {{ $loki.region | quote }}
          bucketnames: {{ $loki.destinationPath | trimPrefix "s3://" }}
          insecure: false
          s3forcepathstyle: true
          # Credentials are NOT set here — they come from the S3_ACCESS_KEY /
          # S3_SECRET_KEY env (see the StatefulSet); Loki's -config.expand-env
          # must not see any un-parsable reference in this file.
        {{- end }}
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      compactor_address: http://{{ include "fixbot.fullname" . }}-loki:3100
    ingester:
      wal:
        # nfs-csi's statfs reports the shared GPFS volume, not this 5Gi PVC.
        # Keep the default 0.9 only on a truly private filesystem.
        disk_full_threshold: {{ $loki.diskFullThreshold }}
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: {{ if $loki.interimFilesystem.enabled }}filesystem{{ else }}s3{{ end }}
          schema: v13
          index:
            prefix: fixbot_index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
    limits_config:
      retention_period: {{ $loki.retention }}
      max_query_lookback: {{ $loki.retention }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ $loki.retention }}
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: {{ if $loki.interimFilesystem.enabled }}filesystem{{ else }}s3{{ end }}
      compactor_ring:
        kvstore:
          store: inmemory
{{- if $loki.interimFilesystem.enabled }}
---
# Optional Loki chunk storage on a PVC (filesystem driver). Delete this PVC
# and set interimFilesystem.enabled=false to return to the object store.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fixbot.fullname" . }}-loki
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $loki.interimFilesystem.storageClass | quote }}
  resources:
    requests:
      storage: {{ $loki.interimFilesystem.size | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fixbot.fullname" . }}-loki
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fixbot.fullname" . }}-loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: fixbot
      fixbot.example.com/component: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fixbot
        fixbot.example.com/component: loki
      annotations:
        # Force a roll on every upgrade so config/secret changes actually apply
        # (K8s never restarts a pod for a ConfigMap/Secret change by itself).
        checksum/revision: {{ .Release.Revision | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: "{{ $loki.image.repository }}:{{ $loki.image.tag }}"
          imagePullPolicy: {{ $loki.image.pullPolicy }}
          args:
            - -config.file=/etc/loki/loki.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if not $loki.interimFilesystem.enabled }}
          env:
            # Thanos objstore (used by Loki's S3 storage) reads credentials
            # from S3_ACCESS_KEY / S3_SECRET_KEY; AWS_* kept for the SDK chain.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $loki.s3CredentialsSecretName }}
                  key: ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $loki.s3CredentialsSecretName }}
                  key: ACCESS_SECRET_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $loki.s3CredentialsSecretName }}
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $loki.s3CredentialsSecretName }}
                  key: ACCESS_SECRET_KEY
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            {{- toYaml $loki.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "fixbot.fullname" . }}-loki-config
        {{- if $loki.interimFilesystem.enabled }}
        # INTERIM filesystem storage (see loki.yaml): chunks live here while
        # S3 is down, so it must be a PVC (survives reschedules), not emptyDir.
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fixbot.fullname" . }}-loki
        {{- else }}
        # Local working dir only (index cache / compactor); log chunks and the
        # object index live in S3 (example-fixbot-loki bucket). Ephemeral is fine —
        # tsdb shipper re-syncs from S3 after a reschedule.
        - name: data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixbot.fullname" . }}-loki
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app.kubernetes.io/part-of: fixbot
    fixbot.example.com/component: loki
{{- end }}
