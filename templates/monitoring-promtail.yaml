{{- if .Values.monitoring.enabled }}
{{- $m := .Values.monitoring }}
{{- $ns := .Values.namespace }}
---
# promtail-as-syslog-server: the logging operator (SyslogNGOutput from
# syslog.yaml) forwards `part-of=fixbot` pod logs here; promtail pushes them to
# Loki. Keeps log collection free (platform-operated) without host access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fixbot.fullname" . }}-promtail-config
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://{{ include "fixbot.fullname" . }}-loki:3100/loki/api/v1/push
    scrape_configs:
      # Receive fixbot pod logs from the logging operator.
      # Its SyslogNGOutput `syslog()` destination defaults to UDP (classic
      # syslog); TCP added for flexibility. TCP and UDP share port 5514.
      - job_name: syslog-tcp
        syslog:
          listen_address: 0.0.0.0:5514
          listen_protocol: tcp
          use_incoming_timestamp: true
          labels:
            job: fixbot-logs
        relabel_configs:
          - source_labels: ["__syslog_message_hostname"]
            target_label: "host"
          - source_labels: ["__syslog_message_app_name"]
            target_label: "app"
          - source_labels: ["__syslog_connection_hostname"]
            target_label: "source"
        # The logging operator forwards the container-runtime line as a CRI JSON
        # envelope {"message": "...", "kubernetes": {"pod_name": "..."}}. Unwrap
        # it so Grafana shows the human-readable message, and stamp the source
        # pod as a label (pod names encode the Course, for example fixbot-example-webui-0) so logs can be filtered per Course.
        pipeline_stages:
          - json:
              expressions:
                message: message
                pod: kubernetes.pod_name
          - labels:
              pod:
          - output:
              source: message
      - job_name: syslog-udp
        syslog:
          listen_address: 0.0.0.0:5514
          listen_protocol: udp
          use_incoming_timestamp: true
          labels:
            job: fixbot-logs
        relabel_configs:
          - source_labels: ["__syslog_message_hostname"]
            target_label: "host"
          - source_labels: ["__syslog_message_app_name"]
            target_label: "app"
          - source_labels: ["__syslog_connection_hostname"]
            target_label: "source"
        pipeline_stages:
          - json:
              expressions:
                message: message
                pod: kubernetes.pod_name
          - labels:
              pod:
          - output:
              source: message
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fixbot.fullname" . }}-logsink
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: fixbot
      fixbot.example.com/component: logsink
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fixbot
        fixbot.example.com/component: logsink
      annotations:
        checksum/revision: {{ .Release.Revision | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: "{{ $m.promtail.image.repository }}:{{ $m.promtail.image.tag }}"
          imagePullPolicy: {{ $m.promtail.image.pullPolicy }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: syslog
              containerPort: 5514
              protocol: TCP
            - name: http
              containerPort: 9080
              protocol: TCP
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
          resources:
            {{- toYaml $m.promtail.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /ready, port: 9080 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "fixbot.fullname" . }}-promtail-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fixbot.fullname" . }}-logsink-svc
  namespace: {{ $ns }}
  labels:
    {{- include "fixbot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: syslog-tcp
      port: 5514
      targetPort: 5514
      protocol: TCP
    - name: syslog-udp
      port: 5514
      targetPort: 5514
      protocol: UDP
  selector:
    app.kubernetes.io/part-of: fixbot
    fixbot.example.com/component: logsink
{{- end }}
